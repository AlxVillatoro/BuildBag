micronaut:
  application:
    name: BuildBag
  server:
    port: 8080
  router:
    static-resources:
      default:
        enabled: true
        mapping: /static/**
        paths: classpath:static
      swagger:
        enabled: true
        mapping: /swagger/**
        paths: classpath:META-INF/swagger
      swagger-ui:
        enabled: true
        mapping: /swagger-ui/**
        paths: classpath:META-INF/swagger/views/swagger-ui
      rapidoc:
        enabled: true
        mapping: /rapidoc/**
        paths: classpath:META-INF/swagger/views/rapidoc
      redoc:
        enabled: true
        mapping: /redoc/**
        paths: classpath:META-INF/swagger/views/redoc
  views:
    thymeleaf:
      enabled: true
  security:
    enabled: true
    # Controllers declare their access with @Secured; this map only covers routes without a controller
    intercept-url-map:
      - pattern: /static/**
        access:
          - isAnonymous()
      - pattern: /swagger/**
        access:
          - isAnonymous()
      - pattern: /swagger-ui/**
        access:
          - isAnonymous()
      - pattern: /rapidoc/**
        access:
          - isAnonymous()
      - pattern: /redoc/**
        access:
          - isAnonymous()
    token:
      jwt:
        enabled: true
        signatures:
          secret:
            generator:
              secret: "${JWT_SECRET:replace-with-long-secret-change-this-please-at-least-256-bits}"
        generator:
          access-token:
            expiration: 86400

datasources:
  default:
    url: jdbc:h2:file:./data/buildbag;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

jpa:
  default:
    packages: com.ixlab.domain
    properties:
      hibernate:
        hbm2ddl:
          auto: update
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: false

logging:
  level:
    root: INFO
