datasources:
  default:
    url: "${DB_URL}"
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

jpa:
  default:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect

micronaut:
  security:
    token:
      jwt:
        signatures:
          secret:
            generator:
              # No default on purpose: this environment must not start with the development secret
              secret: "${JWT_SECRET}"
