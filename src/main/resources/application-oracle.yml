datasources:
  default:
    url: "${DB_URL}"
    driverClassName: oracle.jdbc.OracleDriver
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"

jpa:
  default:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.Oracle12cDialect

micronaut:
  security:
    token:
      jwt:
        signatures:
          secret:
            generator:
              # No default on purpose: this environment must not start with the development secret
              secret: "${JWT_SECRET}"
